# Central configuration for the Credit Risk Scoring system.
#
# Every value below is read by ``credit_risk.config`` into a typed dataclass and
# can be overridden with environment variables (see ``credit_risk/config.py``).
# No secrets belong in this file; use ``.env`` for deployment-specific values.

project:
  name: credit-risk-scoring
  version: "1.0.0"

# Global random seed. Every stochastic step (splits, model fitting, search)
# derives its seed from this value so a run is reproducible.
seed: 42

data:
  raw_path: data/raw/cc_default.xls
  raw_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/00350/default%20of%20credit%20card%20clients.xls"
  source_url: "https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients"
  # Expected schema guard-rails for data validation.
  expected_rows: 30000
  expected_columns: 25
  min_default_rate: 0.10
  max_default_rate: 0.40

paths:
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  experiments_dir: reports/experiments

columns:
  id: id
  target: default_payment_next_month
  # Features used by the model. Sensitive attributes are deliberately EXCLUDED
  # from model inputs and used only for fairness auditing (see `sensitive`).
  numeric:
    - limit_bal
    - age
    - pay_0
    - pay_2
    - pay_3
    - pay_4
    - pay_5
    - pay_6
    - bill_amt1
    - bill_amt2
    - bill_amt3
    - bill_amt4
    - bill_amt5
    - bill_amt6
    - pay_amt1
    - pay_amt2
    - pay_amt3
    - pay_amt4
    - pay_amt5
    - pay_amt6
  categorical:
    - education
  # Not used as model features. Retained for responsible-ML auditing only.
  sensitive:
    - sex
    - marriage

engineering:
  pay_columns: [pay_0, pay_2, pay_3, pay_4, pay_5, pay_6]
  bill_columns: [bill_amt1, bill_amt2, bill_amt3, bill_amt4, bill_amt5, bill_amt6]
  payment_columns: [pay_amt1, pay_amt2, pay_amt3, pay_amt4, pay_amt5, pay_amt6]
  limit_column: limit_bal

split:
  train: 0.70
  validation: 0.15
  test: 0.15

training:
  cv_folds: 5
  # Search budget sized for a 4-core machine. Each estimator uses all cores
  # internally, so the outer search runs serially to avoid nested parallelism.
  search_iterations:
    logistic_regression: 12
    random_forest: 8
    lightgbm: 10
  scoring: average_precision   # PR-AUC: sensitive to the minority (default) class
  model_selection_tolerance: 0.005  # prefer the simpler model within this PR-AUC band
  class_weight_options: [null, balanced]  # imbalance strategies compared empirically
  permutation_repeats: 5
  n_jobs_search: 1             # serial outer search; estimators parallelise internally

model:
  n_estimators: 200
  max_iter: 4000
  n_jobs: -1

calibration:
  methods: [sigmoid, isotonic]

threshold:
  min: 0.05
  max: 0.80
  step: 0.01
  # Expected business cost of an error. Missing a default (FN) is treated as
  # five times as costly as declining a good client (FP). These are policy
  # parameters, not measured quantities, and are documented as such.
  cost_false_negative: 5.0
  cost_false_positive: 1.0

risk:
  # Decision policy, applied to the *calibrated* default probability:
  #   probability <  approve_threshold (learned)     -> LOW    / APPROVE
  #   approve_threshold <= probability < decline     -> MEDIUM / REVIEW
  #   probability >= decline_threshold               -> HIGH   / DECLINE
  # The approve threshold is learned on validation data (business-cost optimum);
  # the decline threshold is a policy cut set by the risk owner.
  decline_threshold: 0.60

serving:
  model_path: models/credit_risk_model.joblib
  metadata_path: models/model_metadata.json
  host: "0.0.0.0"
  api_port: 8000
  dashboard_port: 8501

logging:
  level: INFO
